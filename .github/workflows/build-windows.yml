name: Build Windows Standalone

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Frontend & Tauri App
        run: npm run tauri:build

      - name: Prepare portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/app.exe "portable/LibreTours 360.exe"

      # GitHub always downloads artifacts as a zip: this one is the portable app,
      # the next one the NSIS installer.
      - name: Upload Windows Portable (zip)
        uses: actions/upload-artifact@v4
        with:
          name: LibreTours-Studio-Windows-x64-portable
          path: portable/

      - name: Upload Windows Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: LibreTours-Studio-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
