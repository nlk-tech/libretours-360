name: Build Linux AppImage

on:
  workflow_dispatch:

jobs:
  build-linux:
    # The oldest supported Ubuntu: an AppImage runs only on distributions with the
    # same or a newer glibc than the one it was built against.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # tauri.conf.json lists the macOS/Windows bundles; ask for the AppImage here.
      - name: Build Frontend & Tauri App
        run: npm run tauri:build -- --bundles appimage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: LibreTours-Studio-Linux-x64-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
